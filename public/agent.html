<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Matrix.ai — Sovereign Agent Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════ TOKENS ═══════════════════════════════ */
:root {
  --bg:      #050505;
  --bg2:     #0a0a0a;
  --bg3:     #111111;
  --surface: rgba(255,255,255,0.03);
  --border:  rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.12);
  --text:    #f0f0f0;
  --text2:   #a0a0a0;
  --text3:   #606060;
  --accent:  #ffffff;
  --purple:  #7c3aed;
  --blue:    #3b82f6;
  --green:   #10b981;
  --red:     #ef4444;
  --r:       8px;
  --r-lg:    12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit;transition:all 0.2s}
textarea{font-family:inherit;resize:none;outline:none;border:none;background:transparent;color:inherit}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:10px}

/* ═══════════════════════════ LAYOUT ═══════════════════════════ */
.app { display:flex; height:100vh; overflow:hidden; }

/* LEFT: Input Panel */
.left-panel {
  width: 340px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.left-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.5px; }
.brand svg { width: 18px; height: 18px; }

/* Task input */
.task-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.section-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.input-wrap {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px;
  transition: border-color 0.2s;
}
.input-wrap:focus-within { border-color: var(--text2); }
.task-textarea {
  width: 100%;
  min-height: 120px;
  font-size: 13px;
  line-height: 1.6;
}

/* Skills Bar */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.skill-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  font-size: 11px;
  font-weight: 500;
  color: var(--text2);
}
.skill-btn svg { width: 14px; height: 14px; opacity: 0.7; }
.skill-btn.active {
  background: rgba(255,255,255,0.08);
  border-color: var(--text2);
  color: var(--text);
}
.skill-btn.active svg { opacity: 1; }

.run-btn {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: var(--bg);
  border-radius: var(--r);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.run-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* CENTER: Live Activity */
.center-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
  border-right: 1px solid var(--border);
}
.center-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.status-indicator { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text2); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); }
.dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }

/* Activity Feed */
.activity-feed {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Terminal Component */
.terminal-wrap {
  background: #000;
  border: 1px solid var(--border2);
  border-radius: var(--r);
  overflow: hidden;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 10px;
}
.terminal-header {
  background: #111;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid var(--border);
}
.term-dot { width: 8px; height: 8px; border-radius: 50%; }
.terminal-body {
  padding: 12px;
  font-size: 11px;
  color: #86efac;
  max-height: 200px;
  overflow-y: auto;
  line-height: 1.5;
}

/* Step Card */
.step-item {
  display: flex;
  gap: 16px;
}
.step-line {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.step-icon-circle {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg2);
}
.step-icon-circle svg { width: 14px; height: 14px; }
.step-connector { width: 1px; flex: 1; background: var(--border); }
.step-content { flex: 1; padding-bottom: 24px; }
.step-title { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
.step-thought { color: var(--text2); line-height: 1.6; margin-bottom: 10px; }

/* RIGHT: Result Panel */
.right-panel {
  width: 420px;
  flex-shrink: 0;
  background: var(--bg2);
  display: flex;
  flex-direction: column;
}
.right-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.result-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  line-height: 1.8;
  font-size: 14px;
}
.result-content h1, .result-content h2 { margin-top: 20px; margin-bottom: 10px; font-weight: 700; }
.result-content p { margin-bottom: 12px; }

/* Icons SVG */
.icon-search { fill: none; stroke: currentColor; stroke-width: 2; }
</style>
</head>
<body>
<div class="app">
  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="left-header">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2z"/></svg>
        MATRIX.AI
      </div>
      <button onclick="location.href='/app'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    </div>

    <div class="task-container">
      <div>
        <div class="section-label">Task Objective</div>
        <div class="input-wrap">
          <textarea id="task-input" class="task-textarea" placeholder="Enter mission parameters..."></textarea>
        </div>
      </div>

      <div>
        <div class="section-label">Available Skills</div>
        <div class="skills-grid">
          <button class="skill-btn active" onclick="this.classList.toggle('active')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            Web Search
          </button>
          <button class="skill-btn active" onclick="this.classList.toggle('active')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
            Code Sandbox
          </button>
          <button class="skill-btn" onclick="this.classList.toggle('active')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            GitHub
          </button>
          <button class="skill-btn" onclick="this.classList.toggle('active')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            Data Analysis
          </button>
        </div>
      </div>

      <button class="run-btn" id="run-btn" onclick="runAgent()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Execute Mission
      </button>
    </div>
  </div>

  <!-- CENTER PANEL -->
  <div class="center-panel">
    <div class="center-header">
      <span style="font-weight:600;font-size:12px;letter-spacing:0.5px">MISSION LOG</span>
      <div class="status-indicator">
        <div class="dot" id="status-dot"></div>
        <span id="status-label">IDLE</span>
      </div>
    </div>
    <div id="activity-feed" class="activity-feed">
      <!-- Empty state -->
      <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);text-align:center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom:16px"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <p style="font-size:12px">Waiting for mission parameters...</p>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="right-header">
      <span style="font-weight:600;font-size:12px;letter-spacing:0.5px">FINAL OUTPUT</span>
      <button onclick="copyOutput()" style="font-size:10px;font-weight:600;color:var(--text2)">COPY</button>
    </div>
    <div id="result-content" class="result-content">
      <p style="color:var(--text3);text-align:center;margin-top:40px">Output will be rendered here.</p>
    </div>
  </div>
</div>

<script>
async function runAgent() {
  const task = document.getElementById('task-input').value;
  if(!task) return;
  
  const btn = document.getElementById('run-btn');
  const dot = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  const feed = document.getElementById('activity-feed');
  const result = document.getElementById('result-content');
  
  btn.disabled = true;
  dot.classList.add('active');
  label.textContent = 'EXECUTING';
  feed.innerHTML = '';
  result.innerHTML = '<p style="color:var(--text3)">Processing mission...</p>';

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: task })
    });
    const data = await response.json();
    
    // Mocking the "thinking" steps for UI feel
    addStep("Analyzing Request", "Identifying core objectives and required tools.");
    setTimeout(() => addStep("Tool Selection", "Initializing Web Search and Sandbox environment."), 1000);
    setTimeout(() => {
      addTerminal("Sandbox", "> Initializing virtual machine...\n> Environment: Ubuntu 24.04\n> Running mission logic...\n> Success: Mission objective achieved.");
    }, 2000);
    
    setTimeout(() => {
      result.innerHTML = renderMarkdown(data.reply);
      dot.classList.remove('active');
      label.textContent = 'COMPLETED';
      btn.disabled = false;
    }, 3500);

  } catch (e) {
    result.innerHTML = `<p style="color:var(--red)">Error: ${e.message}</p>`;
    btn.disabled = false;
  }
}

function addStep(title, thought) {
  const feed = document.getElementById('activity-feed');
  const step = document.createElement('div');
  step.className = 'step-item';
  step.innerHTML = `
    <div class="step-line"><div class="step-icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="step-connector"></div></div>
    <div class="step-content"><div class="step-title">${title}</div><div class="step-thought">${thought}</div></div>
  `;
  feed.appendChild(step);
  feed.scrollTop = feed.scrollHeight;
}

function addTerminal(title, content) {
  const feed = document.getElementById('activity-feed');
  const term = document.createElement('div');
  term.className = 'terminal-wrap';
  term.innerHTML = `
    <div class="terminal-header"><div class="term-dot" style="background:#ff5f56"></div><div class="term-dot" style="background:#ffbd2e"></div><div class="term-dot" style="background:#27c93f"></div><span style="font-size:9px;color:var(--text3);margin-left:4px">${title}</span></div>
    <div class="terminal-body">${content.replace(/\n/g, '<br>')}</div>
  `;
  feed.appendChild(term);
  feed.scrollTop = feed.scrollHeight;
}

function renderMarkdown(text) {
  return text
    .replace(/^# (.*$)/gim, '<h2>$1</h2>')
    .replace(/^## (.*$)/gim, '<h3>$1</h3>')
    .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function copyOutput() {
  const text = document.getElementById('result-content').innerText;
  navigator.clipboard.writeText(text);
}
</script>
</body>
</html>
